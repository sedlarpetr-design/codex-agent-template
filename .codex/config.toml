# Codex runtime settings only; shared contracts live in templates/CORE_RULES.md.
sandbox_mode = "read-only"
approval_policy = "on-request"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = false

[features]
apps = false
plugins = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2
max_depth = 1 # Limit V1. V2 se řídí pravidlem role v AGENTS.md.
