version: "2.2.0"
catalog: scenarios_live
description: "Kompletni katalog 24 zivych webovych a AI testovacich scenaru"

scenarios:
  - id: MAP-01
    level: basic
    site_types: [any]
    sitemap_mode: fetch_root
    title: "Mapa webu (robots.txt a sitemap.xml)"
    check: map_01_sitemap_discovery
    steps:
      - action: goto
        target: /robots.txt
      - action: goto
        target: /sitemap.xml

  - id: SEO-01
    level: basic
    site_types: [any]
    sitemap_mode: subset_from_sitemap
    title: "Zakladni SEO metadata a kanonicka URL"
    check: seo_01_metadata_canonical
    steps:
      - action: goto
        target: /

  - id: SEO-02
    level: extended
    site_types: [any]
    sitemap_mode: uses_sitemap
    title: "Robots.txt a dostupnost sitemapy"
    check: seo_02_robots_sitemap
    steps:
      - action: goto
        target: /robots.txt

  - id: SEO-03
    level: extended
    site_types: [any, presentation]
    sitemap_mode: subset_from_sitemap
    title: "Struktura nadpisu H1-H3 a alt texty obrazku"
