catalog_id: live-web-ai-scenarios-v2
version: "2.0.0"
default_browser: chromium

profiles:
  basic:
    include_levels: [basic]
  extended:
    include_levels: [basic, extended]
  full:
    include_levels: [basic, extended, optional]

sitemap:
  enabled: true
  paths:
    - /sitemap.xml
    - /sitemap_index.xml
  sample_limit_per_type: 5

scenarios:
  - id: SEO-01
    level: basic
    site_types: [any]
    title: Základní SEO metadata a kanonická URL
    checks_cpu: [http_status_200, seo_basics_valid]
    steps:
      - step_id: open_home
        step: Otevřít titulní stránku
        action: goto
        target: /

  - id: SEO-02
    level: extended
    site_types: [any]
    title: Robots.txt a dostupnost sitemapy
    checks_cpu: [http_status_200]
    steps:
      - step_id: fetch_robots
        step: Načíst robots.txt
        action: goto
        target: /robots.txt
      - step_id: fetch_sitemap
        step: Načíst sitemap.xml
        action: goto
        target: /sitemap.xml

  - id: SEARCH-01
    level: extended
    site_types: [any, shop]
    title: Interní vyhledávání – platný dotaz a nulový výsledek
    checks_cpu: [steps_passed, scenario_covered]
    steps:
      - step_id: open_search
        step: Otevřít úvodní stránku s vyhledáváním
        action: goto
        target: /
      - step_id: query_valid
        step: Vyhledat existující výraz
        action: fill_submit
        target: "input[type='search'], input[name='q'], input[name='s']"
        value: "{{valid_query}}"
      - step_id: query_empty
        step: Vyhledat neexistující výraz
        action: fill_submit
        target: "input[type='search'], input[name='q'], input[name='s']"
        value: "zzznonexistentquery98765"

  - id: AI-01
    level: extended
    site_types: [any, shop, presentation]
    title: AI-Search připravenost (llms.txt a strukturovaná citovatelnost)
    checks_cpu: [ai_search_llms_txt]
    steps:
      - step_id: check_llms_txt
        step: Ověřit dostupnost /llms.txt
        action: goto
        target: /llms.txt
      - step_id: check_structured_page
        step: Načíst stránku pro kontrolu JSON-LD a struktury citací
        action: goto
        target: /

  - id: UX-01
    level: basic
    site_types: [any, presentation]
    title: Hlavní navigace a primární výzva k akci (CTA)
    checks_cpu: [steps_passed, scenario_covered]
    steps:
      - step_id: open_landing
        step: Načíst vstupní stránku
        action: goto
        target: /

  - id: UX-09
    level: extended
    site_types: [any]
    title: Cookie lišta – odmítnutí bez vynucení souhlasu
    checks_cpu: [security_and_cookies_ok]
    steps:
      - step_id: open_clean_session
        step: Otevřít web v čistém kontextu
        action: goto
        target: /
      - step_id: reject_cookies
        step: Odmítnout volitelné cookies
        action: click
        target: "[data-cookie-reject], button.reject-all, button.cookie-decline"

  - id: I18N-01
    level: extended
    site_types: [any]
    title: Deklarace jazyka dokumentu a hreflang vazby
    checks_cpu: [i18n_and_currency_consistent]
    steps:
      - step_id: inspect_locale_home
        step: Načíst výchozí jazykovou mutaci
        action: goto
        target: /

  - id: I18N-02
    level: optional
    site_types: [any]
    title: Přepínač jazyků a konzistence překladu rozhraní
    checks_cpu: [i18n_and_currency_consistent]
    steps:
      - step_id: open_default_lang
        step: Otevřít výchozí jazyk
        action: goto
        target: /
      - step_id: switch_lang
        step: Přepnout na sekundární jazykovou mutaci
        action: click
        target: "[data-lang-switch], a[hreflang]"

  - id: CURR-01
    level: extended
    site_types: [shop]
    title: Formát měny a konzistence cen v katalogu
    checks_cpu: [i18n_and_currency_consistent]
    steps:
      - step_id: open_catalog
        step: Otevřít katalog produktů
        action: goto
        target: "{{catalog_path}}"

  - id: CURR-02
    level: optional
    site_types: [shop]
    title: Přepnutí měny a přepočet košíku
    checks_cpu: [i18n_and_currency_consistent]
    steps:
      - step_id: switch_currency
        step: Změnit měnu na EUR
        action: click
        target: "[data-currency='EUR'], select[name='currency']"

  - id: SHOP-02
    level: extended
    site_types: [shop]
    title: Průchod z detailu produktu do košíku bez odeslání objednávky
    deny_actions: [submit_order, payment]
    checks_cpu: [steps_passed, scenario_covered]
    steps:
      - step_id: open_product
        step: Otevřít detail dostupného produktu
        action: goto
        target: "{{product_path}}"
      - step_id: add_to_cart
        step: Vložit položku do košíku
        action: click
        target: "button.add-to-cart, [data-action='add-to-cart']"

  - id: SEC-01
    level: basic
    site_types: [any]
    title: HTTPS přesměrování a základní bezpečnostní hlavičky
    checks_cpu: [security_and_cookies_ok]
    steps:
      - step_id: check_security
        step: Načíst stránku přes HTTPS a zachytit hlavičky
        action: goto
        target: /

  - id: PERF-01
    level: optional
    site_types: [any]
    title: Základní metriky načtení (TTFB, DOMContentLoaded, velikost přenosu)
    checks_cpu: [perf_within_budget]
    thresholds:
      max_ttfb_ms: 1200
      max_dom_loaded_ms: 3500
      max_transfer_kb: 3072
    steps:
      - step_id: measure_perf
        step: Změřit časování načtení titulní stránky
        action: goto
        target: /